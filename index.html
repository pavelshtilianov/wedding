<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Сватбено меню</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --cream: #f9f8f4;
            --gold: #b69a43;
            --gold-light: #d6c58e;
            --green: #4f674e;
            --text: #4f554e;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f3f1eb;

            color: var(--text);

            font-family: Arial, sans-serif;
        }


        /* ========================================
        ЦЯЛАТА ПОКАНА
        ======================================== */

        .wedding-page {

            width: calc(100% - 40px);

            max-width: 800px;

            min-height: 100vh;

            margin: 0 auto;

        }


        /* ========================================
        HEADER
        ======================================== */

        .wedding-header {

            width: 100%;

            aspect-ratio: 4 / 1;

            background-image:
                url("assets/header.jpg");

            background-size: 100% 100%;

            background-repeat: no-repeat;

        }


        /* ========================================
        BODY

        ТУК СЕ ПОВТАРЯ ЦЕНТРАЛНАТА ЧАСТ
        ======================================== */

        .wedding-body {

            width: 100%;

            min-height: 460px;

            background-image:
                url("assets/body.jpg");

            background-size: 100% auto;

            background-repeat: repeat-y;

            background-position: top center;

            margin-top: -23px;

        }


        /* ========================================
        FOOTER
        ======================================== */

        .wedding-footer {

            width: 100%;

            aspect-ratio: 3.36 / 1;

            background-image:
                url("assets/footer.jpg");

            background-size: 100% 100%;

            background-repeat: no-repeat;

        }


        /* ========================================
        СЪДЪРЖАНИЕ НА ФОРМАТА
        ======================================== */

        .form-content {

            width: min(100% - 40px, 620px);

            margin: 0 auto;

            padding: 0 20px 50px 20px;

        }


        /* ========================================
        ЗАГЛАВИЕ
        ======================================== */

        h1 {
            margin: 0;

            text-align: center;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 52px;

            font-weight: 500;

            line-height: 1;

            color: var(--green);

            letter-spacing: 0.5px;
        }

        /* ========================================
        ВЪПРОСИ
        ======================================== */

        .question {

            margin-bottom: 25px;

        }

        label {

            display: block;

            margin-bottom: 10px;

            font-size: 17px;

            font-weight: 500;

            color: var(--green);

        }

        .required {
            color: #a65a4d;
        }


        /* ========================================
        INPUTS
        ======================================== */

        select,
        textarea,
        input {

            width: 100%;

            padding:
                14px
                15px;

            font-family: inherit;

            font-size: 16px;

            color: var(--text);

            background:
                rgba(255, 255, 255, 0.85);

            border:
                1px solid var(--gold-light);

            border-radius: 3px;

        }

        select:focus,
        textarea:focus,
        input:focus {

            outline: none;

            border-color: var(--gold);

        }

        textarea {

            min-height: 110px;

            resize: vertical;

        }


        /* ========================================
        ГОСТ
        ======================================== */

        .guest-section {

            padding-top: 25px;

        }

        .guest-section h2 {

            margin:
                0
                0
                30px;

            text-align: center;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 36px;

            font-weight: 500;

            line-height: 1;

            color: var(--green);

        }


        /* ========================================
        BUTTON
        ======================================== */

        button {

            width: 100%;

            margin-top: 30px;

            padding: 16px;

            border:
                1px solid var(--gold);

            border-radius: 3px;

            background:
                var(--green);

            color: white;

            font-size: 17px;

            cursor: pointer;

        }

        button:hover {

            background:
                #40563f;

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        .add-guest-button {

            margin-top: 0;

            background: transparent;

            color: var(--green);

            border:
                1px solid var(--gold);

        }

        .add-guest-button:hover {

            background:
                rgba(79, 103, 78, 0.06);

        }


        /* ========================================
        STATUS
        ======================================== */

        #status {

            min-height: 25px;

            margin-top: 20px;

            text-align: center;

            color: var(--green);

        }

        /* ========================================
        DIVIDER
        ======================================== */

        .guest-divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: auto;
            width: 80%;
        }

        .guest-divider::before,
        .guest-divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: var(--gold-light);
        }

        .guest-divider-flowers {
            display: flex;
            align-items: center;
            gap: 3px;

            color: var(--green-light);

            font-family: Georgia, serif;
            font-size: 20px;

            line-height: 1;
        }

        .guest-divider-flowers span:nth-child(2) {
            color: var(--green);
            font-size: 25px;
        }

        #menuForm {
            padding-top: 10px;
        }

        /* ========================================
        SUCCESS SCREEN
        ======================================== */

        .success-screen {
            display: none;

            min-height: 480px;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 20px;
        }

        .success-screen.visible {
            display: flex;
        }

        .success-content {
            max-width: 420px;
        }

        .success-decoration {
            margin-bottom: 25px;

            color: var(--green-light);

            font-family: Georgia, serif;

            font-size: 38px;

            line-height: 1;
        }

        .success-screen h2 {
            margin: 0 0 22px;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 48px;

            font-weight: 500;

            line-height: 1;

            color: var(--green);
        }

        .success-message {
            margin: 0;

            font-size: 17px;

            line-height: 1.7;

            color: var(--text);
        }

        .success-note {
            margin: 28px 0 0;

            font-size: 14px;

            line-height: 1.6;

            color: var(--green-light);
        }        

        /* ========================================
        MOBILE
        ======================================== */

        @media (max-width: 600px) {

            .form-content {

                width:
                    min(100% - 24px, 620px);

                padding:
                    10px
                    20px
                    40px;

            }

            h1 {

                font-size: 44px;

                margin-bottom: 35px;

            }

            .guest-section h2 {
                font-size: 32px;
            }

            .wedding-page {
                width: 100%;
            }

            .success-screen {
                min-height: 400px;

                padding: 40px 20px;
            }

            .success-screen h2 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="wedding-page">

    <div class="wedding-header"></div>

    <main class="wedding-body">

        <div class="form-content">

            <h1>Сватбено меню</h1>

            <form id="menuForm">


                <div id="guestsContainer"></div>

                <button
                    type="button"
                    id="addGuestButton"
                    class="add-guest-button"
                >
                    + Добави гост
                </button>

                <button
                    type="submit"
                    id="submitButton"
                >
                    Изпрати
                </button>

                <div id="status"></div>

            </form>

            <div
                id="successScreen"
                class="success-screen"
            >

                <div class="success-content">

                    <div class="success-decoration">
                        ❀
                    </div>

                    <h2>
                        Благодарим!
                    </h2>

                    <p class="success-message">
                        Вашият избор за менюто<br>
                        беше успешно изпратен.
                    </p>

                    <p class="success-note">
                        Ако се наложи да направите промяна, изпратете го 
                           отново със забележка или се свържете с нас.
                    </p>

                </div>

            </div>

        </div>

    </main>

    <div class="wedding-footer"></div>

</div>

<script>

    // ========================================
    // GOOGLE APPS SCRIPT URL
    // ЩЕ ГО ПОСТАВИМ ПО-КЪСНО
    // ========================================

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrzSxPca8a-LHEQZGZKWEYxC6ae4xkOLEWy1SJGQL62VJTWMhAZ9dPj1LTlZCOFVd0rA/exec";

    const addGuestButton =
        document.getElementById("addGuestButton");

    const guestsContainer =
        document.getElementById("guestsContainer");

    const form =
        document.getElementById("menuForm");
    
    const successScreen =
        document.getElementById("successScreen");

    const submitButton =
        document.getElementById("submitButton");

    const status =
        document.getElementById("status");


    // ========================================
    // КОГАТО СЕ ИЗБЕРЕ БРОЙ ГОСТИ
    // ========================================

    function addGuest(scrollToGuest = false) {
        const guestNumber =
            guestsContainer.querySelectorAll(".guest-section").length + 1;


        const guestSection =
            document.createElement("div");


        guestSection.className =
            "guest-section";


        guestSection.innerHTML = `

            <div class="question">

                <label>
                    Име
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="name_${guestNumber}"
                    required
                    autocomplete="name"
                >

            </div>


            <div class="question">

                <label>
                    Салата
                    <span class="required">*</span>
                </label>

                <select
                    name="salad_${guestNumber}"
                    required
                >

                    <option value="">
                        Изберете
                    </option>

                    <option value="Салата 1">
                        Салата 1
                    </option>

                    <option value="Салата 2">
                        Салата 2
                    </option>

                    <option value="Салата 3">
                        Салата 3
                    </option>

                </select>

            </div>


            <div class="question">

                <label>
                    Основно
                    <span class="required">*</span>
                </label>

                <select
                    name="main_${guestNumber}"
                    required
                >

                    <option value="">
                        Изберете
                    </option>

                    <option value="Основно 1">
                        Основно 1
                    </option>

                    <option value="Основно 2">
                        Основно 2
                    </option>

                    <option value="Основно 3">
                        Основно 3
                    </option>

                </select>

            </div>


            <div class="question">

                <label>
                    Забележка
                </label>

                <textarea
                    name="note_${guestNumber}"
                    placeholder="Напишете тук, ако има нещо важно (алергии, непоносимости, предпочитания и т.н.)"
                ></textarea>

            </div>

        `;

        const divider =
            document.createElement("div");

        divider.className =
            "guest-divider";

        divider.innerHTML = `
            <div class="guest-divider-flowers">
                <span>❀</span>
                <span>✿</span>
                <span>❀</span>
            </div>
        `;

        guestsContainer.appendChild(divider);

        guestsContainer.appendChild(
            guestSection
        );

        if (scrollToGuest) {
            guestSection.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

    }

    addGuest();

    addGuestButton.addEventListener(
        "click",
        addGuest
    );

    // ========================================
    // SUBMIT
    // ========================================

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const guestCount =
            guestsContainer.querySelectorAll(".guest-section").length;


        const guests = [];


        for (let i = 1; i <= guestCount; i++) {

            guests.push({

                guestNumber: i,

                name:
                    document
                        .querySelector(
                            `[name="name_${i}"]`
                        )
                        .value,

                salad:
                    document
                        .querySelector(
                            `[name="salad_${i}"]`
                        )
                        .value,

                main:
                    document
                        .querySelector(
                            `[name="main_${i}"]`
                        )
                        .value,

                note:
                    document
                        .querySelector(
                            `[name="note_${i}"]`
                        )
                        .value

            });

        }

        const data = {

            guestCount: guestCount,

            guests: guests

        };


        submitButton.disabled = true;

        status.textContent =
            "Изпращане...";


        try {

            await fetch(SCRIPT_URL, {
            
                method: "POST",
            
                mode: "no-cors",
            
                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
            
                body:
                    JSON.stringify(data)
            
            });

            form.style.display = "none";

            successScreen.classList.add("visible");

        } catch (error) {

            console.error(error);

            status.textContent =
                "Възникна грешка. Моля, опитайте отново.";

        } finally {

            submitButton.disabled = false;

        }

    });

</script>

</body>
</html>
