<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Сватбено меню</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --cream: #f9f8f4;
            --gold: #b69a43;
            --gold-light: #d6c58e;
            --green: #4f674e;
            --text: #4f554e;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f3f1eb;

            color: var(--text);

            font-family: Arial, sans-serif;
        }


        /* ========================================
        ЦЯЛАТА ПОКАНА
        ======================================== */

        .wedding-page {

            width: calc(100% - 40px);

            max-width: 800px;

            min-height: 100vh;

            margin: 0 auto;

        }


        /* ========================================
        HEADER
        ======================================== */

        .wedding-header {

            width: 100%;

            aspect-ratio: 3.66 / 1;

            background-image:
                url("assets/header.jpg");

            background-size: 100% 100%;

            background-repeat: no-repeat;

        }


        /* ========================================
        BODY

        ТУК СЕ ПОВТАРЯ ЦЕНТРАЛНАТА ЧАСТ
        ======================================== */

        .wedding-body {

            width: 100%;

            min-height: 460px;

            background-image:
                url("assets/body.jpg");

            background-size: 100% auto;

            background-repeat: repeat-y;

            background-position: top center;

        }


        /* ========================================
        FOOTER
        ======================================== */

        .wedding-footer {

            width: 100%;

            aspect-ratio: 3.36 / 1;

            background-image:
                url("assets/footer.jpg");

            background-size: 100% 100%;

            background-repeat: no-repeat;

        }


        /* ========================================
        СЪДЪРЖАНИЕ НА ФОРМАТА
        ======================================== */

        .form-content {

            width: min(100% - 40px, 620px);

            margin: 0 auto;

            padding: 0 20px 50px 20px;

        }


        /* ========================================
        ЗАГЛАВИЕ
        ======================================== */

        h1 {

            margin:
                0
                0
                45px;

            text-align: center;

            font-size: 42px;

            font-weight: 400;

            color: var(--green);

        }


        /* ========================================
        ВЪПРОСИ
        ======================================== */

        .question {

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-bottom: 10px;

            font-size: 17px;

            font-weight: 500;

            color: var(--green);

        }

        .required {
            color: #a65a4d;
        }


        /* ========================================
        INPUTS
        ======================================== */

        select,
        textarea,
        input {

            width: 100%;

            padding:
                14px
                15px;

            font-family: inherit;

            font-size: 16px;

            color: var(--text);

            background:
                rgba(255, 255, 255, 0.85);

            border:
                1px solid var(--gold-light);

            border-radius: 3px;

        }

        select:focus,
        textarea:focus,
        input:focus {

            outline: none;

            border-color: var(--gold);

        }

        textarea {

            min-height: 110px;

            resize: vertical;

        }


        /* ========================================
        ГОСТ
        ======================================== */

        .guest-section {

            margin-top: 45px;

            padding-top: 35px;

            border-top:
                1px solid var(--gold-light);

        }

        .guest-section h2 {

            margin:
                0
                0
                30px;

            text-align: center;

            font-size: 28px;

            font-weight: 400;

            color: var(--green);

        }


        /* ========================================
        BUTTON
        ======================================== */

        button {

            width: 100%;

            margin-top: 30px;

            padding: 16px;

            border:
                1px solid var(--gold);

            border-radius: 3px;

            background:
                var(--green);

            color: white;

            font-size: 17px;

            cursor: pointer;

        }

        button:hover {

            background:
                #40563f;

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ========================================
        STATUS
        ======================================== */

        #status {

            min-height: 25px;

            margin-top: 20px;

            text-align: center;

            color: var(--green);

        }


        /* ========================================
        MOBILE
        ======================================== */

        @media (max-width: 600px) {

            .form-content {

                width:
                    min(100% - 24px, 620px);

                padding:
                    10px
                    20px
                    40px;

            }

            h1 {

                font-size: 34px;

                margin-bottom: 35px;

            }

        }
    </style>
</head>

<body>

<div class="wedding-page">

    <div class="wedding-header"></div>

    <main class="wedding-body">

        <div class="form-content">

            <h1>Сватбено меню</h1>

            <form id="menuForm">

                <div class="question">

                    <label for="guestCount">
                        Брой гости
                        <span class="required">*</span>
                    </label>

                    <select id="guestCount" required>

                        <option value="">
                            Изберете
                        </option>

                        <option value="1">1 гост</option>
                        <option value="2">2 гости</option>
                        <option value="3">3 гости</option>
                        <option value="4">4 гости</option>
                        <option value="5">5 гости</option>
                        <option value="6">6 гости</option>
                        <option value="7">7 гости</option>
                        <option value="8">8 гости</option>
                        <option value="9">9 гости</option>
                        <option value="10">10 гости</option>

                    </select>

                </div>

                <div id="guestsContainer"></div>

                <button
                    type="submit"
                    id="submitButton"
                >
                    Изпрати
                </button>

                <div id="status"></div>

            </form>

        </div>

    </main>

    <div class="wedding-footer"></div>

</div>

<script>

    // ========================================
    // GOOGLE APPS SCRIPT URL
    // ЩЕ ГО ПОСТАВИМ ПО-КЪСНО
    // ========================================

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrzSxPca8a-LHEQZGZKWEYxC6ae4xkOLEWy1SJGQL62VJTWMhAZ9dPj1LTlZCOFVd0rA/exec";


    const guestCountSelect =
        document.getElementById("guestCount");

    const guestsContainer =
        document.getElementById("guestsContainer");

    const form =
        document.getElementById("menuForm");

    const submitButton =
        document.getElementById("submitButton");

    const status =
        document.getElementById("status");


    // ========================================
    // КОГАТО СЕ ИЗБЕРЕ БРОЙ ГОСТИ
    // ========================================

    guestCountSelect.addEventListener("change", function () {

        const guestCount = Number(this.value);

        guestsContainer.innerHTML = "";


        for (let i = 1; i <= guestCount; i++) {

            const guestSection =
                document.createElement("div");

            guestSection.className =
                "guest-section";


            guestSection.innerHTML = `

                <h2>Гост ${i}</h2>


                <div class="question">

                    <label>
                        Салата
                        <span class="required">*</span>
                    </label>

                    <select
                        name="salad_${i}"
                        required
                    >

                        <option value="">
                            Изберете
                        </option>

                        <option value="Салата 1">
                            Салата 1
                        </option>

                        <option value="Салата 2">
                            Салата 2
                        </option>

                        <option value="Салата 3">
                            Салата 3
                        </option>

                    </select>

                </div>


                <div class="question">

                    <label>
                        Основно
                        <span class="required">*</span>
                    </label>

                    <select
                        name="main_${i}"
                        required
                    >

                        <option value="">
                            Изберете
                        </option>

                        <option value="Основно 1">
                            Основно 1
                        </option>

                        <option value="Основно 2">
                            Основно 2
                        </option>

                        <option value="Основно 3">
                            Основно 3
                        </option>

                    </select>

                </div>


                <div class="question">

                    <label>
                        Хранителни алергии или непоносимости?
                    </label>

                    <textarea
                        name="allergies_${i}"
                        placeholder="Напишете тук, ако има такива"
                    ></textarea>

                </div>

            `;


            guestsContainer.appendChild(
                guestSection
            );

        }

    });


    // ========================================
    // SUBMIT
    // ========================================

    form.addEventListener("submit", async function (event) {

        event.preventDefault();


        const guestCount =
            Number(guestCountSelect.value);


        const guests = [];


        for (let i = 1; i <= guestCount; i++) {

            guests.push({

                guestNumber: i,

                salad:
                    document
                        .querySelector(
                            `[name="salad_${i}"]`
                        )
                        .value,

                main:
                    document
                        .querySelector(
                            `[name="main_${i}"]`
                        )
                        .value,

                allergies:
                    document
                        .querySelector(
                            `[name="allergies_${i}"]`
                        )
                        .value

            });

        }


        const data = {

            guestCount: guestCount,

            guests: guests

        };


        submitButton.disabled = true;

        status.textContent =
            "Изпращане...";


        try {

            await fetch(SCRIPT_URL, {
            
                method: "POST",
            
                mode: "no-cors",
            
                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
            
                body:
                    JSON.stringify(data)
            
            });

            status.textContent =
                "Благодарим! Вашият избор беше изпратен успешно.";

            form.reset();

            guestsContainer.innerHTML = "";


        } catch (error) {

            console.error(error);

            status.textContent =
                "Възникна грешка. Моля, опитайте отново.";

        } finally {

            submitButton.disabled = false;

        }

    });

</script>

</body>
</html>
